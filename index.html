<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔨 打地鼠游戏</h1>

        <div class="scoreboard">
            <div class="score-item">
                <span class="label">得分:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">时间:</span>
                <span id="time" class="value">30</span>
            </div>
            <div class="score-item">
                <span class="label">最高分:</span>
                <span id="highScore" class="value">0</span>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- 9个洞口 -->
            <div class="hole" data-index="0">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="1">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="2">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="3">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="4">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="5">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="6">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="7">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="8">
                <div class="mole"></div>
            </div>
        </div>

        <button id="startBtn" class="start-btn">开始游戏</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
